<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频通话服务端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>视频通话服务端</h1>
  <div class="pills">
    <span id="sigStatus" class="pill off">信令未连接</span>
    <span id="peerStatus" class="pill off">Android 离线</span>
  </div>
</header>

<main>
  <section id="login" class="card hidden">
    <h2>登录</h2>
    <p>此服务端已设置访问密码。</p>
    <form id="loginForm">
      <input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required>
      <button type="submit" class="primary">登录</button>
    </form>
    <p id="loginError" class="error"></p>
  </section>

  <section id="stage" class="hidden">
    <div class="videos">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="idleOverlay" class="overlay">
        <div class="big">等待 Android 呼叫…</div>
        <div class="small">证书 SHA-256 指纹（Android 首次连接时核对）</div>
        <code id="fingerprint" class="fp"></code>
      </div>
      <div id="callInfo" class="callinfo hidden">
        <span id="callPeer"></span> · <span id="callTimer">00:00</span>
        <span id="netInfo"></span>
      </div>
    </div>

    <div id="controls" class="controls hidden">
      <button id="btnMute">静音</button>
      <button id="btnCam">关闭摄像头</button>
      <select id="camSelect" title="摄像头"></select>
      <select id="micSelect" title="麦克风"></select>
      <button id="btnHangup" class="danger">挂断</button>
    </div>
    <p id="stageMsg" class="msg"></p>
  </section>
</main>

<div id="incoming" class="modal hidden">
  <div class="card">
    <h2>来电</h2>
    <p><b id="incomingName"></b> 正在呼叫你</p>
    <div class="row">
      <button id="btnAccept" class="primary">接听</button>
      <button id="btnReject" class="danger">拒绝</button>
    </div>
  </div>
</div>

<footer>版本 <span id="version"></span></footer>
<script src="app.js"></script>
</body>
</html>
